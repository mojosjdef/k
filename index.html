<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0a">
  <title>ТВОЙ ПОКЕР. ВСЕГДА С ТОБОЙ.</title>
  <style>
    :root{--bg:#080a09;--panel:#101310;--green:#123b2b;--gold:#c8a76a;--gold-light:#ead7a8;--muted:#b7b4a9;--line:rgba(200,167,106,.27)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:#f4f0e7;font-family:Inter,Arial,Helvetica,sans-serif;min-height:100vh}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
    .wrap{width:min(1160px,100% - 44px);margin:auto;position:relative}
    main{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding:70px 0 76px;min-height:calc(100vh - 83px)}
    .eyebrow{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:10px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:25px}
    .eyebrow:before{content:"";height:1px;width:34px;background:var(--gold)}
    h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.045em;line-height:.98;font-size:clamp(43px,5.2vw,76px);margin:0 0 35px;color:var(--gold-light)}
    h1 span{display:block;color:#f5f0e5;margin-top:12px}
    .benefits{list-style:none;padding:0;margin:0 0 36px;display:grid;gap:18px}
    .benefits li{display:flex;align-items:center;gap:14px;font-size:clamp(14px,1.25vw,16px);line-height:1.5;color:#e6e1d6}
    .check{flex:0 0 20px;width:20px;height:20px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold-light);font-size:11px}
    .cta{display:inline-flex;align-items:center;justify-content:center;gap:18px;min-height:58px;padding:0 26px;background:linear-gradient(135deg,#e1c58b,#b18a49);color:#15120c;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.13em;border:1px solid #f0dba9;box-shadow:0 10px 35px rgba(175,135,65,.17);transition:transform .2s ease,box-shadow .2s ease}
    .cta:hover{transform:translateY(-2px);box-shadow:0 14px 42px rgba(175,135,65,.27)}
    .cta svg{width:18px;height:18px}
    .visual{position:relative;min-height:540px;display:grid;place-items:center}
    .halo{position:absolute;width:82%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(22,82,56,.42) 0,rgba(11,32,24,.18) 44%,transparent 70%)}
    .table{position:relative;width:min(100%,490px);aspect-ratio:1.02/1;border-radius:50%;background:radial-gradient(ellipse at 42% 35%,#1c6042 0%,#10412e 45%,#08251b 73%,#050b08 100%);border:13px solid #171817;box-shadow:inset 0 0 0 2px rgba(202,170,105,.55),inset 0 0 0 10px #0a0d0b,0 32px 70px rgba(0,0,0,.65);transform:rotate(-7deg)}
    .table:before{content:"";position:absolute;inset:16px;border:1px solid rgba(215,187,128,.25);border-radius:50%}
    .table:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(118deg,transparent 0 4px,rgba(255,255,255,.018) 5px,transparent 6px);opacity:.65}
    .phone{position:absolute;z-index:3;width:44%;height:72%;left:31%;top:12%;border-radius:29px;padding:8px;background:linear-gradient(130deg,#4d504b,#0a0b0a 25%,#252723 70%,#68685d);border:1px solid #6c6b5e;box-shadow:0 25px 50px rgba(0,0,0,.75);transform:rotate(8deg)}
    .screen{height:100%;border-radius:22px;overflow:hidden;background:#080e0b;border:1px solid #343a32;position:relative;padding:19px 10px 12px}
    .speaker{position:absolute;top:7px;left:50%;transform:translateX(-50%);height:4px;width:43px;border-radius:8px;background:#353831}
    .screen-head{display:flex;justify-content:space-between;align-items:center;color:#e9d5a4;font-size:7px;letter-spacing:.15em;margin:8px 0 18px}
    .screen-table{height:54%;border-radius:50%;background:radial-gradient(ellipse,#1a6945,#0d3828 70%);border:4px solid #272a25;box-shadow:inset 0 0 0 1px #a88b51;position:relative;display:grid;place-items:center}
    .screen-table:before{content:"";position:absolute;inset:10px;border:1px solid rgba(218,194,136,.32);border-radius:50%}
    .cards{display:flex;gap:5px;transform:rotate(-5deg);z-index:1}
    .card{height:67px;width:45px;background:#f3eee2;color:#171914;border-radius:4px;box-shadow:0 4px 8px #06110b;font-family:Georgia,serif;padding:5px 4px;font-size:14px;line-height:1.05}
    .card.red{color:#9c3028;transform:translateY(-5px) rotate(8deg)}
    .card small{display:block;font-size:8px;margin-top:2px}
    .screen-bottom{display:flex;justify-content:space-around;margin-top:15px}
    .seat{width:25px;height:25px;border:1px solid #6e795e;border-radius:50%;background:#17261c;box-shadow:0 0 0 3px rgba(200,167,106,.08)}
    .screen-bar{height:5px;background:#27352b;border-radius:6px;margin:13px 5px 0;overflow:hidden}.screen-bar:after{content:"";display:block;width:63%;height:100%;background:#bd9a5a}
    .chip{position:absolute;z-index:4;width:65px;height:65px;border-radius:50%;background:repeating-conic-gradient(#20221e 0deg 12deg,#b4975a 12deg 18deg);box-shadow:0 10px 20px #020503;border:2px solid #c4a466;display:grid;place-items:center}
    .chip:before{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#33362f,#10120f 72%);border:1px solid #b89b61}
    .chip:after{content:"";position:absolute;inset:15px;border-radius:50%;border:1px dashed rgba(213,184,119,.65)}
    .chip-one{left:7%;top:25%;transform:rotate(-15deg)}.chip-two{right:8%;bottom:22%;transform:rotate(18deg);width:54px;height:54px}.chip-three{left:18%;bottom:14%;width:44px;height:44px}
    .playing-card{position:absolute;z-index:2;width:80px;height:116px;background:#eee9dc;border-radius:6px;box-shadow:0 12px 24px rgba(0,0,0,.5);color:#151713;font-family:Georgia,serif;padding:9px;font-size:25px;line-height:1;display:flex;flex-direction:column}
    .playing-card em{font-style:normal;font-size:31px;align-self:center;margin:auto}.playing-card.one{right:6%;top:10%;transform:rotate(17deg)}.playing-card.two{left:5%;bottom:28%;transform:rotate(-19deg);color:#9b3027}
    .edge-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.32em;color:rgba(225,202,151,.72);white-space:nowrap}
    @media(max-width:760px){
      .wrap{width:calc(100% - 36px);max-width:520px}
      main{grid-template-columns:minmax(0,1fr);gap:8px;padding:32px 0 28px;min-height:auto}
      .copy{order:1;min-width:0}
      .visual{order:2;min-height:clamp(280px,82vw,390px);margin:0 -4px;overflow:hidden}
      .eyebrow{margin-bottom:16px;font-size:9px;letter-spacing:.2em}
      h1{font-size:clamp(38px,10.2vw,58px);line-height:1.02;letter-spacing:-.04em;margin-bottom:24px}
      h1 span{margin-top:7px}
      .benefits{gap:12px;margin-bottom:24px}
      .benefits li{font-size:14px;line-height:1.4;gap:11px}
      .check{flex-basis:19px;width:19px;height:19px}
      .cta{display:flex;width:100%;min-height:54px;padding:0 18px;font-size:12px;justify-content:center;gap:12px;touch-action:manipulation}
      .table{width:min(82%,350px);border-width:9px}
      .phone{border-radius:21px;padding:6px}
      .screen{border-radius:16px;padding:14px 7px 9px}
      .screen-head{font-size:6px;margin:8px 0 12px}
      .screen-table{border-width:3px}
      .cards{gap:3px}
      .cards .card{height:clamp(35px,10vw,48px);width:clamp(25px,7vw,33px);font-size:11px;padding:4px 3px}
      .card small{font-size:6px}
      .playing-card{width:clamp(48px,14vw,60px);height:clamp(70px,20vw,86px);font-size:18px;padding:6px}
      .playing-card em{font-size:23px}
      .chip-one{width:44px;height:44px;left:5%;top:25%}
      .chip-two{width:39px;height:39px;right:5%;bottom:20%}
      .chip-three{width:32px;height:32px;left:15%;bottom:12%}
      .edge-label{font-size:6px;letter-spacing:.22em}
    }
    @media(max-width:380px){
      .wrap{width:calc(100% - 28px)}
      main{padding-top:26px}
      h1{font-size:clamp(34px,9.8vw,38px)}
      .benefits li{font-size:13px}
      .visual{min-height:270px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cta{transition:none}}
  </style>

</head>
<body>
  <div class="wrap">
    <main>
      <section class="copy">
        <div class="eyebrow">POKER · ONLINE</div>
        <h1>ТВОЙ ПОКЕР.<span>ВСЕГДА С ТОБОЙ.</span></h1>
        <ul class="benefits">
          <li><span class="check">✓</span><span>Для смартфона и других устройств</span></li>
          <li><span class="check">✓</span><span>Удобный современный интерфейс</span></li>
          <li><span class="check">✓</span><span>Покер в любое удобное время*</span></li>
        </ul>
        <a class="cta" href="https://t.me/+WstRWb5Vwm9iYTAy" target="_blank" rel="noopener noreferrer" aria-label="ИГРАТЬ ОНЛАЙН">
          <span>ИГРАТЬ ОНЛАЙН</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </section>
      <section class="visual" aria-hidden="true">
        <div class="halo"></div>
        <div class="table">
          <div class="phone">
            <div class="screen">
              <div class="speaker"></div>
              <div class="screen-head"><span>POKER TABLE</span><span>•••</span></div>
              <div class="screen-table"><div class="cards"><div class="card">A<small>♠</small></div><div class="card red">K<small>♥</small></div></div></div>

              <div class="screen-bar"></div><div class="screen-bar" style="width:67%;margin-top:8px"></div>
            </div>
          </div>
          <div class="chip chip-one"></div><div class="chip chip-two"></div><div class="chip chip-three"></div>
          <div class="playing-card one">A<em>♠</em></div><div class="playing-card two">K<em>♥</em></div>
          <div class="edge-label">EMERALD · TABLE</div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
